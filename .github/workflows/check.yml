name: Starter checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q wildlife_watch
      - run: python -m wildlife_watch.preview --help
      - run: python -m unittest discover -s wildlife_watch -t . -p "test_*.py" -v
  motor-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test controller logic
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic firmware/tests/controller_test.cpp -o /tmp/controller_test
          /tmp/controller_test
